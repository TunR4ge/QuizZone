<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>QuizZone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101020, #252550);
    color: white;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: rgba(0,0,0,0.25);
}

header h1 {
    margin: 0;
    font-size: 45px;
}

header p {
    color: #cccccc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

h2 {
    text-align: center;
}

button {
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 19px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: scale(1.03);
}

button:disabled {
    cursor: default;
}

/* ================= MUSIQUE ================= */

#musicButton {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 12px 16px;
    background: #5555cc;
    font-size: 15px;
    z-index: 10;
}

#musicButton:hover {
    background: #7070e8;
}

/* ================= CATEGORIES ================= */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.category {
    background: #34345c;
}

.category:hover {
    background: #4c4c80;
}

/* ================= NIVEAUX ================= */

.levels {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 550px;
    margin: auto;
}

.levels button {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.levels span {
    margin-top: 8px;
    font-size: 15px;
}

.easy {
    background: #219653;
}

.medium {
    background: #d68116;
}

.hard {
    background: #c53b4a;
}

.back {
    background: #555;
    margin-top: 25px;
}

/* ================= QUIZ ================= */

#levelPage,
#quizBox,
#result {
    display: none;
}

.quiz-card {
    background: #252542;
    border-radius: 20px;
    padding: 30px;
}

.progress {
    color: #cccccc;
    margin-bottom: 20px;
}

.question {
    font-size: 24px;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #393960;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #51518a;
}

.correct {
    background: #219653 !important;
}

.wrong {
    background: #c53b4a !important;
}

.next {
    display: none;
    background: #5555cc;
    margin-top: 25px;
}

.result {
    text-align: center;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 35px;
    }

    .question {
        font-size: 20px;
    }

}
</style>
</head>

<!-- ================= BOUTON MUSIQUE ================= -->

/* =====================================================
   MUSIQUE
===================================================== */

let audioContext = null;
let musicPlaying = false;
let musicInterval = null;
let currentOscillators = [];


/* ================= BOUTON MUSIQUE ================= */

function toggleMusic() {

    const bouton = document.getElementById("musicButton");

    /* MUSIQUE ON */

    if (!musicPlaying) {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        musicPlaying = true;

        bouton.innerText = "🔊 Musique ON";

        playCalmMusic();

    }

    /* MUSIQUE OFF */

    else {

        musicPlaying = false;

        clearInterval(musicInterval);

        musicInterval = null;

        currentOscillators.forEach(osc => {

            try {
                osc.stop();
            }

            catch(e) {}

        });

        currentOscillators = [];

        if (audioContext) {

            audioContext.close();

            audioContext = null;

        }

        bouton.innerText = "🔇 Musique OFF";

    }

}


/* ================= JOUER UNE NOTE ================= */

function playNote(frequency, startTime, duration) {

    if (!musicPlaying || !audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value =
        frequency;

    gainNode.gain.setValueAtTime(
        0.001,
        startTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.06,
        startTime + 0.4
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
    );

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start(startTime);

    oscillator.stop(
        startTime + duration
    );

    currentOscillators.push(
        oscillator
    );

}


/* ================= MUSIQUE ================= */

function playCalmMusic() {

    const notes = [

        261.63,
        329.63,
        392.00,
        329.63,

        293.66,
        349.23,
        440.00,
        349.23

    ];

    let index = 0;


    function playSequence() {

        if (!musicPlaying || !audioContext) {
            return;
        }

        const now =
            audioContext.currentTime;

        playNote(
            notes[index],
            now,
            1.7
        );

        index++;

        if (index >= notes.length) {

            index = 0;

        }

    }


    playSequence();

    musicInterval = setInterval(
        playSequence,
        1800
    );

}

/* =====================================================
   VARIABLES
===================================================== */

let selectedCategory = "";
let selectedLevel = "";

let currentQuiz = [];
let currentQuestion = 0;
let score = 0;

let usedQuestions = {};


/* =====================================================
   MELANGER
===================================================== */

function shuffle(array) {

    let newArray = [...array];

    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] =
        [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;
}


/* =====================================================
   CATEGORIE
===================================================== */

function chooseCategory(category) {

    selectedCategory = category;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("levelPage")
        .style.display = "block";

}


function backHome() {

    document.getElementById("levelPage")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

}


/* =====================================================
   CREER LE QUIZ
===================================================== */

function createQuiz() {

    const allQuestions =
        quizzes[selectedCategory][selectedLevel];

    let numberOfQuestions;

    if (selectedLevel === "facile") {

        numberOfQuestions = 5;

    }

    else if (selectedLevel === "moyen") {

        numberOfQuestions = 10;

    }

    else {

        numberOfQuestions = 15;

    }


    const quizKey =
        selectedCategory +
        "-" +
        selectedLevel;


    if (!usedQuestions[quizKey]) {

        usedQuestions[quizKey] = [];

    }


    let availableQuestions =
        allQuestions.filter(
            question =>
                !usedQuestions[quizKey]
                    .includes(question[0])
        );


    if (
        availableQuestions.length <
        numberOfQuestions
    ) {

        usedQuestions[quizKey] = [];

        availableQuestions =
            [...allQuestions];

    }


    const selectedQuestions =
        shuffle(availableQuestions)
            .slice(
                0,
                numberOfQuestions
            );


    selectedQuestions.forEach(
        question => {

            usedQuestions[quizKey]
                .push(question[0]);

        }
    );


    currentQuiz =
        selectedQuestions.map(
            question => {

                const shuffledAnswers =
                    shuffle(question[1]);

                return {

                    question:
                        question[0],

                    answers:
                        shuffledAnswers,

                    correct:
                        shuffledAnswers
                            .indexOf(
                                question[2]
                            )

                };

            }
        );

}


/* =====================================================
   DEMARRER
===================================================== */

function startQuiz(level) {

    selectedLevel = level;

    currentQuestion = 0;

    score = 0;

    createQuiz();

    document.getElementById("levelPage")
        .style.display = "none";

    document.getElementById("quizBox")
        .style.display = "block";

    showQuestion();

}


/* =====================================================
   AFFICHER QUESTION
===================================================== */

function showQuestion() {

    const q =
        currentQuiz[currentQuestion];


    document.getElementById("progress")
        .innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        currentQuiz.length;


    document.getElementById("question")
        .innerText =
        q.question;


    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";


    q.answers.forEach(
        (answer, index) => {

            const button =
                document.createElement("button");

            button.innerText =
                answer;

            button.classList.add(
                "answer"
            );

            button.onclick =
                () => selectAnswer(index);

            answers.appendChild(button);

        }
    );


    document.getElementById("nextBtn")
        .style.display =
        "none";

}


/* =====================================================
   REPONSE
===================================================== */

function selectAnswer(selected) {

    const q =
        currentQuiz[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        (button, index) => {

            button.disabled = true;


            if (
                index === q.correct
            ) {

                button.classList.add(
                    "correct"
                );

            }


            if (
                index === selected &&
                index !== q.correct
            ) {

                button.classList.add(
                    "wrong"
                );

            }

        }
    );


    if (
        selected === q.correct
    ) {

        score++;

    }


    document.getElementById("nextBtn")
        .style.display =
        "inline-block";

}


/* =====================================================
   QUESTION SUIVANTE
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion <
        currentQuiz.length
    ) {

        showQuestion();

    }

    else {

        showResult();

    }

}


/* =====================================================
   RESULTAT
===================================================== */

function showResult() {

    document.getElementById("quizBox")
        .style.display =
        "none";

    document.getElementById("result")
        .style.display =
        "block";


    const total =
        currentQuiz.length;


    let message = "";


    if (
        score === total
    ) {

        message =
            "🔥 INCROYABLE ! Score parfait !";

    }

    else if (
        score >= total * 0.8
    ) {

        message =
            "🏆 Excellent !";

    }

    else if (
        score >= total * 0.5
    ) {

        message =
            "👏 Très bon score !";

    }

    else {

        message =
            "💪 Continue à t'entraîner !";

    }


    document.getElementById("scoreText")
        .innerHTML =
        "Tu as obtenu <strong>" +
        score +
        " / " +
        total +
        "</strong><br><br>" +
        message;

}


/* =====================================================
   REJOUER
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    createQuiz();


    document.getElementById("result")
        .style.display =
        "none";

    document.getElementById("quizBox")
        .style.display =
        "block";


    showQuestion();

}


/* =====================================================
   ACCUEIL
===================================================== */

function goHome() {

    document.getElementById("result")
        .style.display =
        "none";

    document.getElementById("quizBox")
        .style.display =
        "none";

    document.getElementById("levelPage")
        .style.display =
        "none";

    document.getElementById("home")
        .style.display =
        "block";

}

</script>
