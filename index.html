<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizZone 🎮</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #34346b 0%, transparent 40%),
        linear-gradient(135deg, #080812, #17172e, #252550);
    overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
    text-align: center;
    padding: 35px 15px;
    background: rgba(0,0,0,0.30);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

header h1 {
    margin: 0;
    font-size: 50px;
    text-shadow: 0 0 20px #7777ff;
}

header p {
    color: #cfcfe5;
    font-size: 18px;
}

/* ================= CONTAINER ================= */

.container {
    max-width: 950px;
    margin: auto;
    padding: 30px 20px 60px;
}

h2 {
    text-align: center;
    font-size: 30px;
}

/* ================= BOUTONS ================= */

button {
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 18px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
}

button:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    filter: brightness(1.15);
}

button:active:not(:disabled) {
    transform: scale(0.98);
}

button:disabled {
    cursor: default;
}

/* ================= MUSIQUE ================= */

#musicButton {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 12px 18px;
    background: #5b5be7;
    font-size: 15px;
    z-index: 100;
    box-shadow: 0 0 20px rgba(91,91,231,0.4);
}

#musicButton.on {
    background: #219653;
}

#musicButton.off {
    background: #c53b4a;
}

/* ================= CATEGORIES ================= */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.category {
    min-height: 120px;
    background: linear-gradient(135deg, #34345c, #444477);
    font-size: 22px;
    border: 1px solid rgba(255,255,255,0.08);
}

.category:hover {
    background: linear-gradient(135deg, #4c4c80, #5c5ca0);
}

/* ================= NIVEAUX ================= */

.levels {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 600px;
    margin: auto;
}

.levels button {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.levels span {
    margin-top: 8px;
    font-size: 15px;
    font-weight: normal;
}

.easy {
    background: linear-gradient(135deg, #219653, #28b463);
}

.medium {
    background: linear-gradient(135deg, #d68116, #f0a52a);
}

.hard {
    background: linear-gradient(135deg, #c53b4a, #ef5263);
}

.back {
    background: #555;
    margin-top: 25px;
}

/* ================= PAGES ================= */

#levelPage,
#quizBox,
#result {
    display: none;
}

/* ================= QUIZ ================= */

.quiz-card {
    background: rgba(37,37,66,0.90);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: #ccccdd;
}

.progress {
    font-weight: bold;
}

.score {
    color: #ffd75a;
    font-weight: bold;
}

/* Barre */

.progress-bar-container {
    width: 100%;
    height: 10px;
    background: #17172b;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5b5be7, #8f8fff);
    border-radius: 20px;
    transition: width 0.4s;
    box-shadow: 0 0 15px #7777ff;
}

/* Question */

.question {
    font-size: 27px;
    margin-bottom: 25px;
    line-height: 1.3;
    font-weight: bold;
}

/* Réponses */

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #393960;
    text-align: left;
    border: 2px solid transparent;
}

.answer:hover:not(:disabled) {
    background: #51518a;
}

.correct {
    background: #219653 !important;
    border-color: #65e59a !important;
}

.wrong {
    background: #c53b4a !important;
    border-color: #ff7b88 !important;
}

/* Question suivante */

.next {
    display: none;
    background: #5555cc;
    margin-top: 25px;
    width: 100%;
}

/* ================= RESULTAT ================= */

.result {
    text-align: center;
}

.result-card {
    background: rgba(37,37,66,0.92);
    padding: 40px 25px;
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}

#scoreText {
    font-size: 22px;
    line-height: 1.6;
}

.big-score {
    font-size: 55px;
    font-weight: bold;
    color: #ffd75a;
    text-shadow: 0 0 20px rgba(255,215,90,0.5);
}

/* ================= ANIMATIONS ================= */

.fade {
    animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 36px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .question {

    }

        right: 10px;
        font-size: 13px;
        padding: 10px 12px;
    }

    .quiz-card {
        padding: 20px;
    }

    button {
        font-size: 16px;
    }
}
</style>
</head>

/* =====================================================
   MUSIQUE GAMING
===================================================== */

let audioContext = null;
let musicPlaying = false;
let musicInterval = null;
let currentOscillators = [];

function toggleMusic() {

    const bouton = document.getElementById("musicButton");

    if (!musicPlaying) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        musicPlaying = true;

        bouton.innerText = "🎵 Musique ON";
        bouton.classList.remove("off");
        bouton.classList.add("on");

        playGamingMusic();

    } else {

        musicPlaying = false;

        clearInterval(musicInterval);

        currentOscillators.forEach(osc => {

            try {
                osc.stop();
            } catch(e) {}

        });

        currentOscillators = [];

        if (audioContext) {

            audioContext.close();
            audioContext = null;

        }

        bouton.innerText = "🔇 Musique OFF";
        bouton.classList.remove("on");
        bouton.classList.add("off");
    }
}


/* ================= NOTE ================= */

function playNote(frequency, startTime, duration, volume = 0.045) {

    if (!musicPlaying || !audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "triangle";

    oscillator.frequency.value =
        frequency;

    gainNode.gain.setValueAtTime(
        0.001,
        startTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
        volume,
        startTime + 0.08
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + duration);

    currentOscillators.push(oscillator);
}


/* ================= MUSIQUE ================= */

function playGamingMusic() {

    const melody = [

        261.63,
        329.63,
        392.00,
        523.25,

        392.00,
        329.63,
        293.66,
        440.00,

        349.23,
        440.00,
        523.25,
        659.25,

        523.25,
        440.00,
        392.00,
        329.63

    ];

    let index = 0;

    function sequence() {

        if (!musicPlaying || !audioContext)
            return;

        const now =
            audioContext.currentTime;

        playNote(
            melody[index],
            now,
            0.55,
            0.055
        );

        index++;

        if (index >= melody.length) {
            index = 0;
        }

    }

    sequence();

    musicInterval =
        setInterval(sequence, 550);
}

/* =====================================================
   VARIABLES
===================================================== */

let selectedCategory = "";
let selectedLevel = "";

let currentQuiz = [];
let currentQuestion = 0;
let score = 0;

let usedQuestions = {};


/* =====================================================
   MÉLANGER
===================================================== */

function shuffle(array) {

    let newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        let j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];

    }

    return newArray;
}


/* =====================================================
   CATÉGORIE
===================================================== */

function chooseCategory(category) {

    selectedCategory = category;

    document.getElementById("home").style.display =
        "none";

    document.getElementById("levelPage").style.display =
        "block";
}


function backHome() {

    document.getElementById("levelPage").style.display =
        "none";

    document.getElementById("home").style.display =
        "block";
}


/* =====================================================
   CRÉER LE QUIZ
===================================================== */

function createQuiz() {

    const allQuestions =
        quizzes[selectedCategory][selectedLevel];

    let numberOfQuestions;

    if (selectedLevel === "facile") {

        numberOfQuestions = 5;

    } else if (selectedLevel === "moyen") {

        numberOfQuestions = 10;

    } else {

        numberOfQuestions = 15;
    }


    const quizKey =
        selectedCategory +
        "-" +
        selectedLevel;


    if (!usedQuestions[quizKey]) {

        usedQuestions[quizKey] = [];
    }


    let availableQuestions =
        allQuestions.filter(
            question =>
                !usedQuestions[quizKey]
                .includes(question[0])
        );


    if (
        availableQuestions.length <
        numberOfQuestions
    ) {

        usedQuestions[quizKey] = [];

        availableQuestions =
            [...allQuestions];
    }


    const selectedQuestions =
        shuffle(availableQuestions)
        .slice(0, numberOfQuestions);


    selectedQuestions.forEach(question => {

        usedQuestions[quizKey]
            .push(question[0]);

    });


    currentQuiz =
        selectedQuestions.map(question => {

            const shuffledAnswers =
                shuffle(question[1]);

            return {

                question: question[0],

                answers: shuffledAnswers,

                correct:
                    shuffledAnswers.indexOf(
                        question[2]
                    )
            };

        });

}


/* =====================================================
   DÉMARRER
===================================================== */

function startQuiz(level) {

    selectedLevel = level;

    currentQuestion = 0;

    score = 0;

    createQuiz();


    document.getElementById("levelPage").style.display =
        "none";

    document.getElementById("quizBox").style.display =
        "block";


    document.getElementById("liveScore")
        .innerText = "⭐ 0";


    showQuestion();
}


/* =====================================================
   AFFICHER QUESTION
===================================================== */

function showQuestion() {

    const q =
        currentQuiz[currentQuestion];


    const quizCard =
        document.querySelector(".quiz-card");

    quizCard.classList.remove("fade");

    void quizCard.offsetWidth;

    quizCard.classList.add("fade");


    document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        currentQuiz.length;


    document.getElementById("question").innerText =
        q.question;


    /* Barre de progression */

    const percentage =
        ((currentQuestion) /
        currentQuiz.length) * 100;

    document.getElementById("progressBar")
        .style.width =
        percentage + "%";


    /* Réponses */

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    q.answers.forEach(
        (answer, index) => {

            const button =
                document.createElement("button");

            button.innerText =
                answer;

            button.classList.add(
                "answer"
            );

            button.onclick =
                () => selectAnswer(index);

            answers.appendChild(button);

        }
    );


    document.getElementById("nextBtn")
        .style.display = "none";
}


/* =====================================================
   RÉPONSE
===================================================== */

function selectAnswer(selected) {

    const q =
        currentQuiz[currentQuestion];


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(
        (button, index) => {

            button.disabled = true;


            if (index === q.correct) {

                button.classList.add(
                    "correct"
                );

            }


            if (
                index === selected &&
                index !== q.correct
            ) {

                button.classList.add(
                    "wrong"
                );

            }

        }
    );


    if (selected === q.correct) {

        score++;

    }


    document.getElementById("liveScore")
        .innerText =
        "⭐ " + score;


    document.getElementById("nextBtn")
        .style.display =
        "inline-block";
}


/* =====================================================
   QUESTION SUIVANTE
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion <
        currentQuiz.length
    ) {

        showQuestion();

    } else {

        showResult();

    }
}


/* =====================================================
   RÉSULTAT
===================================================== */

function showResult() {

    document.getElementById("quizBox")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    const total =
        currentQuiz.length;


    document.getElementById("bigScore")
        .innerText =
        score + " / " + total;


    let message = "";


    if (score === total) {

        message =
            "🔥 INCROYABLE ! Score parfait !";

    }

    else if (score >= total * 0.8) {

        message =
            "🏆 Excellent ! Tu maîtrises le sujet !";

    }

    else if (score >= total * 0.5) {

        message =
            "👏 Très bon score !";

    }

    else {

        message =
            "💪 Continue à t'entraîner !";

    }


    document.getElementById("scoreText")
        .innerHTML =
        message +
        "<br><br>" +
        "Tu as répondu correctement à " +
        "<strong>" +
        score +
        "</strong> question(s).";
}


/* =====================================================
   REJOUER
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    createQuiz();


    document.getElementById("result")
        .style.display = "none";

    document.getElementById("quizBox")
        .style.display = "block";


    document.getElementById("liveScore")
        .innerText = "⭐ 0";


    showQuestion();
}


/* =====================================================
   ACCUEIL
===================================================== */

function goHome() {

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("quizBox")
        .style.display = "none";

    document.getElementById("levelPage")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";
}

</script>
