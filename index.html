<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizZone 🎮</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#101020,#252550);
    transition:.4s;
}

body.neon{background:linear-gradient(135deg,#05001a,#001f35)}
body.red{background:linear-gradient(135deg,#250000,#520d0d)}
body.football{background:linear-gradient(135deg,#001d10,#064d2b)}
body.space{background:linear-gradient(135deg,#020313,#15154c)}

header{
    text-align:center;
    padding:25px 15px;
    background:rgba(0,0,0,.3);
}

header h1{
    margin:0;
    font-size:44px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 20px;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.topbar button{
    padding:12px 16px;
    border-radius:15px;
    border:0;
    color:white;
    background:#35355f;
    cursor:pointer;
}

button{
    border:0;
    border-radius:18px;
    padding:18px;
    font-size:17px;
    color:white;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

.card{
    background:rgba(30,30,60,.9);
    border-radius:22px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.category{
    background:#363663;
    min-height:90px;
}

.levels{
    display:flex;
    flex-direction:column;
    gap:15px;
    max-width:600px;
    margin:auto;
}

.easy{background:#219653}
.medium{background:#d68116}
.hard{background:#c53b4a}
.blue{background:#5555cc}
.back{background:#555}

.hidden{display:none!important}

.answer{
    width:100%;
    background:#3d3d68;
    text-align:left;
    margin-bottom:10px;
}

.correct{
    background:#219653!important;
    animation:correct .5s;
}

.wrong{
    background:#c53b4a!important;
    animation:wrong .5s;
}

@keyframes correct{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}

@keyframes wrong{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    75%{transform:translateX(10px)}
}

.fade{
    animation:fade .35s;
}

@keyframes fade{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

#musicPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:20;
    background:#242442;
    padding:15px;
    border-radius:18px;
    box-shadow:0 10px 30px #0008;
}

#musicButton{
    background:#5555cc;
    padding:12px 16px;
}

#volume{
    width:120px;
    vertical-align:middle;
}

.timer{
    font-size:20px;
    margin:15px 0;
}

.timerBar{
    height:10px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
}

#timerProgress{
    height:100%;
    width:100%;
    background:#42d392;
    transition:width 1s linear;
}

.score{
    font-size:22px;
    text-align:center;
}

.streak{
    text-align:center;
    font-size:20px;
    color:#ffd43b;
    min-height:28px;
}

.profileInput{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:0;
    font-size:18px;
    margin:10px 0;
}

.rank{
    display:flex;
    justify-content:space-between;
    padding:15px;
    margin:8px 0;
    background:#35355d;
    border-radius:12px;
}

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:30;
}

.modalBox{
    width:min(500px,90%);
    background:#252542;
    border-radius:25px;
    padding:30px;
    text-align:center;
}

.shopItem{
    background:#34345c;
    padding:18px;
    border-radius:16px;
    margin:10px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.themeBtn{
    margin:5px;
}

#confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
}

@media(max-width:650px){
    .grid{grid-template-columns:1fr}
    header h1{font-size:35px}
}
</style>
</head>

<body>

<div id="confetti"></div>

<div id="musicPanel">
    <button id="musicButton" onclick="toggleMusic()">🔇 MUSIQUE DÉSACTIVÉE</button>
    <br><br>
    🔊 Volume
    <input id="volume" type="range" min="0" max="100" value="35"
           onchange="changeVolume(this.value)">
</div>

<header>
    <h1>🧠 QuizZone</h1>
    <p>Teste tes connaissances ! 🎮</p>
</header>

<div class="container">

<div class="topbar">
    <button onclick="showProfile()">👤 Profil</button>
    <button onclick="showRanking()">🏆 Classement</button>
    <button onclick="showShop()">🪙 Boutique</button>
    <button onclick="showThemes()">🎨 Thèmes</button>
</div>

<!-- ACCUEIL -->
<div id="home" class="card fade">
    <h2>Choisis une catégorie 👇</h2>

    <div class="grid">
        <button class="category" onclick="chooseCategory('football')">⚽ Football</button>
        <button class="category" onclick="chooseCategory('gaming')">🎮 Gaming</button>
        <button class="category" onclick="chooseCategory('culture')">🌍 Culture générale</button>
        <button class="category" onclick="chooseCategory('films')">🎬 Films & séries</button>
        <button class="category" onclick="chooseCategory('auto')">🏎️ Sport automobile</button>
        <button class="category" onclick="chooseCategory('basket')">🏀 Basketball</button>
        <button class="category" onclick="chooseCategory('science')">🧪 Sciences</button>
        <button class="category" onclick="chooseCategory('space')">🪐 Espace</button>
        <button class="category" onclick="chooseCategory('music')">🎵 Musique</button>
        <button class="category" onclick="chooseCategory('animals')">🦖 Animaux</button>
    </div>

    <div class="score">
        🪙 <span id="coinsHome">0</span> pièces
    </div>
</div>

<!-- NIVEAUX -->
<div id="levelPage" class="card hidden fade">
    <h2>Choisis ton niveau 🔥</h2>

    <div class="levels">
        <button class="easy" onclick="startQuiz('facile')">
            🟢 Niveau 1 — Facile
            <small>5 questions</small>
        </button>

        <button class="medium" onclick="startQuiz('moyen')">
            🟠 Niveau 2 — Moyen
            <small>10 questions</small>
        </button>

        <button class="hard" onclick="startQuiz('difficile')">
            🔴 Niveau 3 — Difficile
            <small>15 questions</small>
        </button>
    </div>

    <br>
    <button class="back" onclick="goHome()">⬅ Retour</button>
</div>

<!-- QUIZ -->
<div id="quizBox" class="card hidden fade">

    <div class="score">
        ⭐ <span id="gameScore">0</span> pts
        &nbsp;&nbsp;
        🔥 Série : <span id="streak">0</span>
    </div>

    <div id="progress"></div>

    <div class="timer">
        ⏱️ <span id="time">15</span> secondes
        <div class="timerBar">
            <div id="timerProgress"></div>
        </div>
    </div>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <div id="feedback" class="streak"></div>

    <button id="nextBtn" class="blue hidden" onclick="nextQuestion()">
        Question suivante ➡️
    </button>
</div>

<!-- RESULTAT -->
<div id="result" class="card hidden fade">
    <h2>🏆 Quiz terminé !</h2>

    <p id="scoreText"></p>

    <button class="easy" onclick="restartQuiz()">🔄 Rejouer</button>
    <button class="back" onclick="goHome()">🏠 Accueil</button>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modalBox" id="modalContent"></div>
</div>

/* =====================================================
   VARIABLES
===================================================== */

let category="";
let level="";
let quiz=[];
let questionIndex=0;
let score=0;
let streak=0;
let timer;
let timeLeft=15;

let audioContext=null;
let masterGain=null;
let musicOn=localStorage.getItem("musicOn")==="true";
let volume=Number(localStorage.getItem("volume")||35);

/* =====================================================
   PROFIL / JOUEURS
===================================================== */

let players=JSON.parse(localStorage.getItem("quizPlayers")||"{}");
let currentPlayer=localStorage.getItem("currentPlayer")||"";

function savePlayers(){
    localStorage.setItem("quizPlayers",JSON.stringify(players));
}

function showProfile(){
    let name=currentPlayer||"";

    openModal(`
        <h2>👤 Mon profil</h2>
        <input id="nameInput" class="profileInput"
               maxlength="16"
               placeholder="Ton pseudo"
               value="${escapeHTML(name)}">
        <button class="blue" onclick="saveProfile()">💾 Enregistrer</button>
        <br><br>
        <button class="back" onclick="closeModal()">Fermer</button>
    `);
}

function saveProfile(){

    const input=document.getElementById("nameInput");
    const name=input.value.trim();

    if(!name){
        alert("Choisis un pseudo !");
        return;
    }

    currentPlayer=name;
    localStorage.setItem("currentPlayer",name);

    if(!players[name]){
        players[name]={
            points:0,
            coins:0,
            bestScore:0,
            wins:0,
            bestStreak:0
        };
    }

    savePlayers();
    closeModal();
    updateHome();
}

function getPlayer(){

    if(!currentPlayer) return null;

    if(!players[currentPlayer]){
        players[currentPlayer]={
            points:0,
            coins:0,
            bestScore:0,
            wins:0,
            bestStreak:0
        };
        savePlayers();
    }

    return players[currentPlayer];
}

function escapeHTML(text){
    return text.replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}

/* =====================================================
   CLASSEMENT
===================================================== */

function showRanking(){

    const list=Object.entries(players)
        .sort((a,b)=>b[1].points-a[1].points);

    let html="<h2>🏆 CLASSEMENT</h2>";

    if(list.length===0){
        html+=`
            <p>Personne ne s'est encore inscrit.</p>
            <p>👤 Va dans Profil pour choisir ton pseudo.</p>
        `;
    }else{

        list.forEach((p,i)=>{

            let medal=["🥇","🥈","🥉"][i]||"🏅";

            html+=`
                <div class="rank">
                    <span>${medal} ${escapeHTML(p[0])}</span>
                    <strong>${p[1].points} pts</strong>
                </div>
            `;
        });
    }

    html+=`<br><button class="back" onclick="closeModal()">Fermer</button>`;

    openModal(html);
}

/* =====================================================
   MODAL
===================================================== */

function openModal(html){
    document.getElementById("modalContent").innerHTML=html;
    document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
    document.getElementById("modal").classList.add("hidden");

/* =====================================================
   MUSIQUE
===================================================== */

function updateMusicButton(){

    const btn=document.getElementById("musicButton");

    if(musicOn){
        btn.innerText="🔊 MUSIQUE ACTIVE";
        btn.style.background="#219653";
    }else{
        btn.innerText="🔇 MUSIQUE DÉSACTIVÉE";
        btn.style.background="#c53b4a";
    }
}

function createAudio(){

    if(audioContext) return;

    audioContext=new(window.AudioContext||window.webkitAudioContext)();

    masterGain=audioContext.createGain();
    masterGain.gain.value=volume/100;
    masterGain.connect(audioContext.destination);
}

function startMusic(){

    createAudio();

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }

    musicOn=true;
    localStorage.setItem("musicOn","true");
    updateMusicButton();

    playMusicLoop();
}

let musicTimeout;

function playMusicLoop(){

    if(!musicOn||!audioContext) return;

    const notes=[261.63,329.63,392,523.25,392,329.63];
    const now=audioContext.currentTime;

    notes.forEach((freq,i)=>{

        const osc=audioContext.createOscillator();
        const gain=audioContext.createGain();

        osc.type="triangle";
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(0.001,now+i*.45);
        gain.gain.exponentialRampToValueAtTime(
            .08,
            now+i*.45+.08
        );
        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+i*.45+.4
        );

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start(now+i*.45);
        osc.stop(now+i*.45+.45);
    });

    musicTimeout=setTimeout(playMusicLoop,2700);
}

function stopMusic(){

    musicOn=false;
    localStorage.setItem("musicOn","false");

    clearTimeout(musicTimeout);

    if(audioContext){
        audioContext.close();
        audioContext=null;
        masterGain=null;
    }

    updateMusicButton();
}

function toggleMusic(){

    if(musicOn){
        stopMusic();
    }else{
        startMusic();
    }
}

function changeVolume(v){

    volume=Number(v);
    localStorage.setItem("volume",volume);

    if(masterGain){
        masterGain.gain.value=volume/100;
    }
}

updateMusicButton();
document.getElementById("volume").value=volume;

/* =====================================================
   PETITS SONS
===================================================== */

function sound(type){

    if(!musicOn) return;

    createAudio();

    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();

    osc.connect(gain);
    gain.connect(masterGain);

    if(type==="correct"){
        osc.frequency.value=700;
        gain.gain.value=.12;
    }else if(type==="wrong"){
        osc.frequency.value=160;
        gain.gain.value=.12;
    }else{
        osc.frequency.value=500;
        gain.gain.value=.08;
    }

    osc.start();

    osc.frequency.exponentialRampToValueAtTime(
        type==="correct"?1000:80,
        audioContext.currentTime+.25
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.25
    );

    osc.stop(audioContext.currentTime+.25);
}

   NAVIGATION
===================================================== */

function chooseCategory(c){

    category=c;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("levelPage").classList.remove("hidden");
}

function goHome(){

    clearInterval(timer);

    document.getElementById("levelPage").classList.add("hidden");
    document.getElementById("quizBox").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");

    updateHome();
}

function updateHome(){

    const p=getPlayer();

    document.getElementById("coinsHome").innerText=
        p?p.coins:0;
}

/* =====================================================
   QUIZ
===================================================== */

function shuffle(arr){

    arr=[...arr];

    for(let i=arr.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];
    }

    return arr;
}

function startQuiz(l){

    if(!currentPlayer){

        openModal(`
            <h2>👤 Profil nécessaire</h2>
            <p>Choisis d'abord ton pseudo dans ton profil.</p>
            <button class="blue" onclick="closeModal();showProfile()">
                👤 Créer mon profil
            </button>
        `);

        return;
    }

    level=l;
    questionIndex=0;
    score=0;
    streak=0;

    const all=quizzes[category][level];

    let number=
        level==="facile"?5:
        level==="moyen"?10:15;

    quiz=shuffle(all).slice(0,Math.min(number,all.length))
        .map(q=>{

            const answers=shuffle(q[1]);

            return{
                question:q[0],
                answers:answers,
                correct:answers.indexOf(q[2])
            };
        });

    document.getElementById("levelPage").classList.add("hidden");
    document.getElementById("quizBox").classList.remove("hidden");

    showQuestion();
}

function showQuestion(){

    clearInterval(timer);

    const q=quiz[questionIndex];

    document.getElementById("progress").innerText=
        `Question ${questionIndex+1} / ${quiz.length}`;

    document.getElementById("question").innerText=q.question;

    document.getElementById("gameScore").innerText=score;
    document.getElementById("streak").innerText=streak;

    document.getElementById("feedback").innerText="";

    const answers=document.getElementById("answers");
    answers.innerHTML="";

    q.answers.forEach((answer,i)=>{

        const btn=document.createElement("button");

        btn.className="answer fade";
        btn.innerText=answer;

        btn.onclick=()=>selectAnswer(i);

        answers.appendChild(btn);
    });

    document.getElementById("nextBtn").classList.add("hidden");

    startTimer();
}

/* =====================================================
   CHRONO
===================================================== */

function startTimer(){

    timeLeft=15;

    updateTimer();

    timer=setInterval(()=>{

        timeLeft--;

        updateTimer();

        if(timeLeft<=0){

            clearInterval(timer);
            timeOut();
        }

    },1000);
}

function updateTimer(){

    document.getElementById("time").innerText=timeLeft;

    document.getElementById("timerProgress").style.width=
        (timeLeft/15*100)+"%";
}

function timeOut(){

    const buttons=document.querySelectorAll(".answer");

    buttons.forEach(b=>b.disabled=true);

    const q=quiz[questionIndex];

    buttons[q.correct].classList.add("correct");

    streak=0;

    document.getElementById("feedback").innerText=
        "⏰ Temps écoulé !";

    sound("wrong");

    document.getElementById("nextBtn").classList.remove("hidden");
}

/* =====================================================
   RÉPONSE
===================================================== */

function selectAnswer(index){

    clearInterval(timer);

    const q=quiz[questionIndex];
    const buttons=document.querySelectorAll(".answer");

    buttons.forEach((b,i)=>{

        b.disabled=true;

        if(i===q.correct)
            b.classList.add("correct");

        if(i===index && i!==q.correct)
            b.classList.add("wrong");
    });

    if(index===q.correct){

        score+=10;
        streak++;

        sound("correct");

        document.getElementById("feedback").innerText=
            `🎉 Bonne réponse ! 🔥 Série : ${streak}`;

        if(streak>=3){

            score+=5;

            document.getElementById("feedback").innerText=
                `🔥 SÉRIE DE ${streak} ! +5 BONUS`;
        }

        if(streak>=(getPlayer().bestStreak||0)){
            getPlayer().bestStreak=streak;
        }

        celebrate();

    }else{

        streak=0;

        sound("wrong");

        document.getElementById("feedback").innerText=
            "💥 Mauvaise réponse !";
    }

    document.getElementById("gameScore").innerText=score;

    document.getElementById("nextBtn").classList.remove("hidden");
}

/* =====================================================
   QUESTION SUIVANTE
===================================================== */

function nextQuestion(){

    questionIndex++;

    if(questionIndex<quiz.length){

        showQuestion();

    }else{

        showResult();
    }
}

/* =====================================================
   FIN DU QUIZ
===================================================== */

function showResult(){

    clearInterval(timer);

    const p=getPlayer();

    const won=score>=quiz.length*10*.5;

    let reward=0;

    if(won){

        p.points+=50;
        p.coins+=250;
        p.wins++;

        reward=50;

        celebrateBig();
    }

    if(score>p.bestScore){
        p.bestScore=score;
    }

    savePlayers();

    document.getElementById("quizBox").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("scoreText").innerHTML=`
        ⭐ Score : <strong>${score}</strong><br><br>

        ${won
        ?"🏆 <strong>QUIZ GAGNÉ !</strong><br>💰 +250 pièces<br>⭐ +50 points au classement"
        :"💪 Continue, tu peux faire mieux !"
        }

        <br><br>

        🏆 Meilleur score : ${p.bestScore}<br>
        🔥 Meilleure série : ${p.bestStreak}<br>
        🏆 Quiz gagnés : ${p.wins}
    `;

    updateHome();
}

/* =====================================================
   ANIMATIONS
===================================================== */

function celebrate(){

    const container=document.getElementById("confetti");

    for(let i=0;i<12;i++){

        const el=document.createElement("div");

        el.innerText=["🎉","⭐","✨","🔥"][Math.floor(Math.random()*4)];

        el.style.position="fixed";
        el.style.left=Math.random()*100+"%";
        el.style.top="50%";
        el.style.fontSize="25px";
        el.style.transition="1s";

        container.appendChild(el);

        setTimeout(()=>{
            el.style.top=Math.random()*100+"%";
            el.style.opacity="0";
            el.style.transform="scale(2)";
        },20);

        setTimeout(()=>el.remove(),1100);
    }
}

function celebrateBig(){

    for(let i=0;i<35;i++){

        const el=document.createElement("div");

        el.innerText=["🎉","🏆","⭐","🔥","💰"][Math.floor(Math.random()*5)];

        el.style.position="fixed";
        el.style.left=Math.random()*100+"%";
        el.style.top="-20px";
        el.style.fontSize=(20+Math.random()*25)+"px";
        el.style.transition=(1.5+Math.random())+"s";

        document.getElementById("confetti").appendChild(el);

        setTimeout(()=>{
            el.style.top="110%";
            el.style.transform="rotate(720deg)";
        },20);

        setTimeout(()=>el.remove(),3000);
    }
}

function restartQuiz(){

    document.getElementById("result").classList.add("hidden");
    document.getElementById("quizBox").classList.remove("hidden");

    questionIndex=0;
    score=0;
    streak=0;

    quiz=shuffle(quizzes[category][level])
        .slice(0,level==="facile"?5:level==="moyen"?10:15)
        .map(q=>{

            const a=shuffle(q[1]);

            return{
                question:q[0],
                answers:a,
                correct:a.indexOf(q[2])
            };
        });

    showQuestion();
}
