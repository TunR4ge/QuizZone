<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizZone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101020, #252550);
    color: white;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: rgba(0,0,0,0.25);
}

header h1 {
    margin: 0;
    font-size: 45px;
}

header p {
    color: #cccccc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

h2 {
    text-align: center;
}

button {
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 19px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: scale(1.03);
}

button:disabled {
    cursor: default;
}

/* MUSIQUE */

#musicButton {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 12px 16px;
    background: #5555cc;
    font-size: 15px;
    z-index: 10;
}

/* CATEGORIES */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.category {
    background: #34345c;
}

.category:hover {
    background: #4c4c80;
}

/* NIVEAUX */

.levels {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 550px;
    margin: auto;
}

.levels button {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.levels span {
    margin-top: 8px;
    font-size: 15px;
}

.easy {
    background: #219653;
}

.medium {
    background: #d68116;
}

.hard {
    background: #c53b4a;
}

.back {
    background: #555;
    margin-top: 25px;
}

/* PAGES */

#levelPage,
#quizBox,
#result {
    display: none;
}

/* QUIZ */

.quiz-card {
    background: #252542;
    border-radius: 20px;
    padding: 30px;
}

.progress {
    color: #cccccc;
    margin-bottom: 20px;
}

.question {
    font-size: 24px;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #393960;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #51518a;
}

.correct {
    background: #219653 !important;
}

.wrong {
    background: #c53b4a !important;
}

.next {
    display: none;
    background: #5555cc;
    margin-top: 25px;
}

.result {
    text-align: center;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 35px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<audio id="musique" loop>
    <source src="musique.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" onclick="toggleMusic()">
    🎵 Musique
</button>

<header>
    <h1>🧠 QuizZone</h1>
    <p>Teste tes connaissances !</p>
</header>

<div class="container">

    <div id="home">

        <h2>Choisis une catégorie 👇</h2>

        <div class="grid">

            <button class="category" onclick="chooseCategory('football')">
                ⚽ Football
            </button>

            <button class="category" onclick="chooseCategory('gaming')">
                🎮 Jeux vidéo
            </button>

            <button class="category" onclick="chooseCategory('culture')">
                🌍 Culture générale
            </button>

            <button class="category" onclick="chooseCategory('films')">
                🎬 Films et séries
            </button>

        </div>

    </div>

    <div id="levelPage">

        <h2>Choisis ton niveau 🔥</h2>

        <div class="levels">

            <button class="easy" onclick="startQuiz('facile')">
                🟢 Niveau 1 — Facile
                <span>5 questions</span>
            </button>

            <button class="medium" onclick="startQuiz('moyen')">
                🟠 Niveau 2 — Moyen
                <span>10 questions</span>
            </button>

            <button class="hard" onclick="startQuiz('difficile')">
                🔴 Niveau 3 — Difficile
                <span>15 questions</span>
            </button>

        </div>

        <button class="back" onclick="backHome()">
            ⬅ Retour
        </button>

    </div>

    <div id="quizBox">

        <div class="quiz-card">

            <div class="progress" id="progress"></div>

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next" id="nextBtn" onclick="nextQuestion()">
                Question suivante ➡️
            </button>

        </div>

    </div>

    <div id="result" class="result">

        <h2>🏆 Quiz terminé !</h2>

        <p id="scoreText"></p>

        <button class="easy" onclick="restartQuiz()">
            🔄 Rejouer
        </button>

        <button class="back" onclick="goHome()">
            🏠 Accueil
        </button>

    </div>

</div>

/* =========================
   VARIABLES
========================= */

let selectedCategory = "";
let selectedLevel = "";
let currentQuiz = [];
let currentQuestion = 0;
let score = 0;

/*
Chaque catégorie et niveau garde
en mémoire les questions déjà utilisées.
*/

let usedQuestions = {};


/* =========================
   MELANGER
========================= */

function shuffle(array) {

    let newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];

    }

    return newArray;
}


/* =========================
   CHOISIR CATEGORIE
========================= */

function chooseCategory(category) {

    selectedCategory = category;

    document.getElementById("home").style.display = "none";
    document.getElementById("levelPage").style.display = "block";
}


/* =========================
   RETOUR
========================= */

function backHome() {

    document.getElementById("levelPage").style.display = "none";
    document.getElementById("home").style.display = "block";
}


/* =========================
   CREER QUIZ SANS DOUBLONS
========================= */

function createQuiz() {

    const allQuestions =
        quizzes[selectedCategory][selectedLevel];

    let numberOfQuestions;

    if (selectedLevel === "facile") {
        numberOfQuestions = 5;
    }

    if (selectedLevel === "moyen") {
        numberOfQuestions = 10;
    }

    if (selectedLevel === "difficile") {
        numberOfQuestions = 15;
    }

    const quizKey =
        selectedCategory + "-" + selectedLevel;

    if (!usedQuestions[quizKey]) {
        usedQuestions[quizKey] = [];
    }

    /*
    On prend uniquement les questions
    qui n'ont pas encore été utilisées.
    */

    let availableQuestions =
        allQuestions.filter(question =>
            !usedQuestions[quizKey].includes(question[0])
        );

    /*
    S'il n'y a plus assez de nouvelles
    questions, on remet la liste à zéro.
    */

    if (availableQuestions.length < numberOfQuestions) {

        usedQuestions[quizKey] = [];

        availableQuestions = [...allQuestions];
    }

    /*
    On mélange puis on prend le nombre
    exact de questions.
    */

    const selectedQuestions =
        shuffle(availableQuestions)
        .slice(0, numberOfQuestions);

    /*
    On enregistre les questions utilisées.
    */

    selectedQuestions.forEach(question => {
        usedQuestions[quizKey].push(question[0]);
    });

    /*
    On mélange aussi les réponses.
    */

    currentQuiz =
        selectedQuestions.map(question => {

            const shuffledAnswers =
                shuffle(question[1]);

            return {
                question: question[0],
                answers: shuffledAnswers,
                correct: shuffledAnswers.indexOf(question[2])
            };

        });
}


/* =========================
   COMMENCER
========================= */

function startQuiz(level) {

    selectedLevel = level;
    currentQuestion = 0;
    score = 0;

    createQuiz();

    document.getElementById("levelPage").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}


/* =========================
   AFFICHER QUESTION
========================= */

function showQuestion() {

    const q = currentQuiz[currentQuestion];

    document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        currentQuiz.length;

    document.getElementById("question").innerText =
        q.question;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.innerText = answer;

        button.classList.add("answer");

        button.onclick = () => selectAnswer(index);

        answers.appendChild(button);

    });

    document.getElementById("nextBtn").style.display = "none";
}


/* =========================
   REPONSE
========================= */

function selectAnswer(selected) {

    const q =
        currentQuiz[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === q.correct) {
            button.classList.add("correct");
        }

        if (
            index === selected &&
            index !== q.correct
        ) {
            button.classList.add("wrong");
        }

    });

    if (selected === q.correct) {
        score++;
    }

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


/* =========================
   QUESTION SUIVANTE
========================= */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < currentQuiz.length) {

        showQuestion();

    } else {

        showResult();

    }
}


/* =========================
   RESULTAT
========================= */

function showResult() {

    document.getElementById("quizBox").style.display = "none";
    document.getElementById("result").style.display = "block";

    const total =
        currentQuiz.length;

    let message = "";

    if (score === total) {

        message = "🔥 INCROYABLE ! Score parfait !";

    } else if (score >= total * 0.8) {

        message = "🏆 Excellent !";

    } else if (score >= total * 0.5) {

        message = "👏 Très bon score !";

    } else {

        message = "💪 Continue à t'entraîner !";

    }

    document.getElementById("scoreText").innerHTML =
        "Tu as obtenu <strong>" +
        score +
        " / " +
        total +
        "</strong><br><br>" +
        message;
}


/* =========================
   REJOUER
========================= */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    createQuiz();

    document.getElementById("result").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}


/* =========================
   ACCUEIL
========================= */

function goHome() {

    document.getElementById("result").style.display = "none";
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("levelPage").style.display = "none";

    document.getElementById("home").style.display = "block";
}

</script>
