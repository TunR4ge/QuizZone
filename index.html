<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizZone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #121212, #1e1e35);
    color: white;
}

header {
    text-align: center;
    padding: 30px 20px;
    background: rgba(0, 0, 0, 0.25);
}

header h1 {
    margin: 0;
    font-size: 45px;
}

header p {
    color: #ccc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

h2 {
    text-align: center;
}

/* CATÉGORIES */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

/* NIVEAUX */

.levels {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 500px;
    margin: auto;
}

.levels button {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.levels button span {
    display: block;
    margin-top: 10px;
    font-size: 16px;
    opacity: 0.9;
}

button {
    border: none;
    border-radius: 18px;
    padding: 22px;
    font-size: 20px;
    cursor: pointer;
    color: white;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: scale(1.03);
}

.category {
    background: #30304a;
}

.category:hover {
    background: #45456b;
}

.easy {
    background: #229b4b;
}

.medium {
    background: #d98b16;
}

.hard {
    background: #c63745;
}

.back {
    background: #555;
    margin-top: 25px;
}

#levelPage,
#quizBox,
#result {
    display: none;
}

/* QUIZ */

.quiz-card {
    background: #242438;
    border-radius: 20px;
    padding: 30px;
}

.progress {
    color: #ccc;
    margin-bottom: 20px;
}

.question {
    font-size: 25px;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #363650;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #4b4b70;
}

.correct {
    background: #229b4b !important;
}

.wrong {
    background: #c63745 !important;
}

.next {
    display: none;
    background: #5555cc;
    margin-top: 25px;
}

.result {
    text-align: center;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧠 QuizZone</h1>
    <p>Teste tes connaissances !</p>
</header>

<div class="container">

    <!-- ACCUEIL -->

    <div id="home">

        <h2>Choisis une catégorie 👇</h2>

        <div class="grid">

            <button class="category" onclick="chooseCategory('football')">
                ⚽ Football
            </button>

            <button class="category" onclick="chooseCategory('gaming')">
                🎮 Jeux vidéo
            </button>

            <button class="category" onclick="chooseCategory('culture')">
                🌍 Culture générale
            </button>

            <button class="category" onclick="chooseCategory('films')">
                🎬 Films & Séries
            </button>

        </div>

    </div>


    <!-- NIVEAUX -->

    <div id="levelPage">

        <h2>Choisis ton niveau 🔥</h2>

        <div class="levels">

            <button class="easy" onclick="startQuiz('facile')">
                🟢 Niveau 1 — Facile
                <span>5 questions</span>
            </button>

            <button class="medium" onclick="startQuiz('moyen')">
                🟠 Niveau 2 — Moyen
                <span>10 questions</span>
            </button>

            <button class="hard" onclick="startQuiz('difficile')">
                🔴 Niveau 3 — Difficile
                <span>15 questions</span>
            </button>

        </div>

        <button class="back" onclick="backHome()">
            ⬅ Retour
        </button>

    </div>


    <!-- QUIZ -->

    <div id="quizBox">

        <div class="quiz-card">

            <div class="progress" id="progress"></div>

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next" id="nextBtn" onclick="nextQuestion()">
                Question suivante ➡️
            </button>

        </div>

    </div>


    <!-- RÉSULTAT -->

    <div id="result" class="result">

        <h2>🏆 Quiz terminé !</h2>

        <p id="scoreText"></p>

        <button class="easy" onclick="restartQuiz()">
            🔄 Rejouer
        </button>

        <button class="back" onclick="goHome()">
            🏠 Accueil
        </button>

    </div>

</div>

/* =====================================
   VARIABLES
===================================== */

let selectedCategory = "";
let selectedLevel = "";
let currentQuiz = [];
let currentQuestion = 0;
let score = 0;

let usedQuestions = {};


/* =====================================
   MÉLANGER LES QUESTIONS
===================================== */

function shuffle(array) {

    let newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];
    }

    return newArray;
}


/* =====================================
   CHOISIR UNE CATÉGORIE
===================================== */

function chooseCategory(category) {

    selectedCategory = category;

    document.getElementById("home").style.display = "none";
    document.getElementById("levelPage").style.display = "block";
}


/* =====================================
   RETOUR
===================================== */

function backHome() {

    document.getElementById("levelPage").style.display = "none";
    document.getElementById("home").style.display = "block";
}


/* =====================================
   CRÉER LE QUIZ
===================================== */

function createQuiz() {

    let allQuestions =
        quizzes[selectedCategory][selectedLevel];

    let numberOfQuestions = 5;

    if (selectedLevel === "moyen") {
        numberOfQuestions = 10;
    }

    if (selectedLevel === "difficile") {
        numberOfQuestions = 15;
    }

    let quizKey =
        selectedCategory + "-" + selectedLevel;

    if (!usedQuestions[quizKey]) {
        usedQuestions[quizKey] = [];
    }

    let availableQuestions =
        allQuestions.filter(q =>
            !usedQuestions[quizKey].includes(q[0])
        );

    if (availableQuestions.length < numberOfQuestions) {

        usedQuestions[quizKey] = [];

        availableQuestions = [...allQuestions];
    }

    let selectedQuestions =
        shuffle(availableQuestions)
        .slice(0, numberOfQuestions);

    currentQuiz =
        selectedQuestions.map(q => {

            let shuffledAnswers =
                shuffle(q[1]);

            return {
                question: q[0],
                answers: shuffledAnswers,
                correct: shuffledAnswers.indexOf(q[2])
            };
        });

    selectedQuestions.forEach(q => {

        usedQuestions[quizKey].push(q[0]);

    });
}


/* =====================================
   DÉMARRER LE QUIZ
===================================== */

function startQuiz(level) {

    selectedLevel = level;

    currentQuestion = 0;
    score = 0;

    createQuiz();

    document.getElementById("levelPage").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}


/* =====================================
   AFFICHER LA QUESTION
===================================== */

function showQuestion() {

    const q = currentQuiz[currentQuestion];

    document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        currentQuiz.length;

    document.getElementById("question").innerText =
        q.question;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.innerText = answer;

        button.classList.add("answer");

        button.onclick =
            () => selectAnswer(index);

        answers.appendChild(button);

    });

    document.getElementById("nextBtn").style.display =
        "none";
}


/* =====================================
   CHOISIR UNE RÉPONSE
===================================== */

function selectAnswer(selected) {

    const q =
        currentQuiz[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === q.correct) {
            button.classList.add("correct");
        }

        if (
            index === selected &&
            index !== q.correct
        ) {
            button.classList.add("wrong");
        }

    });

    if (selected === q.correct) {
        score++;
    }

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


/* =====================================
   QUESTION SUIVANTE
===================================== */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < currentQuiz.length) {

        showQuestion();

    } else {

        showResult();

    }
}


/* =====================================
   RÉSULTAT
===================================== */

function showResult() {

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    let total =
        currentQuiz.length;

    let message = "";

    if (score === total) {

        message =
            "🔥 INCROYABLE ! Score parfait !";

    } else if (score >= total * 0.8) {

        message =
            "🏆 Excellent ! Tu es très fort !";

    } else if (score >= total * 0.5) {

        message =
            "👏 Très bon score !";

    } else {

        message =
            "💪 Continue à t'entraîner !";
    }

    document.getElementById("scoreText").innerHTML =
        "Tu as obtenu <strong>" +
        score +
        " / " +
        total +
        "</strong><br><br>" +
        message;
}


/* =====================================
   REJOUER
===================================== */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    createQuiz();

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quizBox").style.display =
        "block";

    showQuestion();
}


/* =====================================
   RETOUR À L'ACCUEIL
===================================== */

function goHome() {

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("levelPage").style.display =
        "none";

    document.getElementById("home").style.display =
        "block";
}

</script>
